<!DOCTYPE html>
<!--
  FILES: index.html (structure) + style.css (looks) + app.js (logic). Keep all three in the same folder.
  PULSE - Project Health Monitor (prototype)
  HOW TO USE IN VS CODE: open this file, then right-click > "Open with Live Server" (install the Live Server extension),
  or just double-click the file to open it in a browser. Edit, save, refresh.
  STRUCTURE: <style> = looks, <div id="app"> = empty root, <script> = all logic and screens.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulse – Project Health Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<!-- STYLES: all the look of the site lives in this <style> block. Change colours, fonts and spacing here. -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- APP ROOT: the page is empty on purpose. JavaScript below draws every screen (login, dashboard, ...) into this div. -->
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
